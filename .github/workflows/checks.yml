name: Checks

# Drift checks run on pull requests so problems are caught at review time,
# not at deploy time. Before this workflow existed nothing ran the check:*
# scripts at all — which is how the nav drifted far enough that the entire
# Automation section was missing from search and the mobile menu.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every page must be registered in src/nav.mjs — the single source of
      # truth behind the sidebar, header, mobile menu and search index.
      - name: Nav drift
        run: pnpm check:nav

      - name: Brand token drift
        run: pnpm check:tokens

      # `check:limits` is deliberately NOT run here. It compares against core's
      # built packages/shared, which does not exist on this runner, so it exits 0
      # with "SKIP: core repo not found" — a green step that verifies nothing is
      # worse than no step. It has to be run locally, from a checkout that has
      # the core repo alongside:
      #   node scripts/check-limits-drift.mjs
      # Enforcing it here would need core checked out (private repo, needs a
      # token) or the limits published to a package docs can consume.
